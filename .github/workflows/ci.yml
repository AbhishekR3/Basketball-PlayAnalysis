name: Basketball PlayAnalysis CI

on:
  push:
    branches: [ main, DEV_Code ]
  pull_request:
    branches: [ main, DEV_Code ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    
    - name: Build Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        push: false
        load: true
        tags: playbook-ai:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run tests in Docker container
      run: |
        # Create a Docker volume
        docker volume create basketball_data
        # Run container with volume mounted
        docker run --name playbook-test -v basketball_data:/app/output playbook-ai:test
        # Copy logs from volume to local filesystem for checking and artifacts
        docker container create --name temp-container -v basketball_data:/data busybox
        mkdir -p ./output/logs
        docker cp temp-container:/data/logs ./output/
        docker rm temp-container
        
    - name: Check test results
      run: |
        if grep -q "All scripts completed successfully" ./output/logs/run_sequence.log; then
          echo "✅ Tests passed successfully!"
          exit 0
        else
          echo "❌ Tests failed!"
          cat ./output/logs/run_sequence.log
          exit 1
        fi
        
    - name: Upload logs as artifacts
      if: always()
      uses: actions/upload-artifact@v2
      with:
        name: test-logs
        path: ./output/logs/